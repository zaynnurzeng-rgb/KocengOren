buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.2.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
    }
}

allprojects {
    ext {
        appName = "Koceng Oren"
        gdxVersion = '1.12.1'
        gltfVersion = '2.2.1'
        kotlinVersion = '1.9.22'
    }

    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
